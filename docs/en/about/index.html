<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About — Idalina Insfrán</title>
  
  <meta name="color-scheme" content="light dark">
  <script>
    // Aplica el modo elegido antes de pintar la página, así no parpadea.
    try { var t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="columna">
    <a class="marca" href="/en/">Idalina Insfrán</a>
    <nav aria-label="Menú">
      <a href="/en/">Services</a>
      <a href="/en/enfoque/">Approach</a>
      <a href="/en/detalles/">Details</a>
      <a href="/en/about/" aria-current="page">About</a>
    </nav>
    <div class="opciones">
      <a href="/es/" lang="es" hreflang="es">Español</a>
      <button id="tema" type="button" data-oscuro="Dark mode" data-claro="Light mode">Dark mode</button>
    </div>
  </header>

  <main class="columna">
    <article>
      <h1>About</h1>
      
<p>Este es mi about.</p>

    </article>
  </main>

  <footer class="columna">© 2026 Idalina Insfrán</footer>

  <script>
    // Botón de modo oscuro/claro: recuerda la elección en el navegador.
    (function () {
      var boton = document.getElementById('tema');
      var raiz = document.documentElement;
      function actual() {
        return raiz.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      }
      function etiqueta() {
        boton.textContent = actual() === 'dark' ? boton.dataset.claro : boton.dataset.oscuro;
      }
      boton.addEventListener('click', function () {
        var nuevo = actual() === 'dark' ? 'light' : 'dark';
        raiz.dataset.theme = nuevo;
        try { localStorage.setItem('tema', nuevo); } catch (e) {}
        etiqueta();
      });
      etiqueta();
    })();
  </script>
</body>
</html>
